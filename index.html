<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Lorenzo De Sanctis | Mechanical Engineer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mechanical engineer specializing in 3D kinematics and imaging.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* MINIMALIST ENGINEERING THEME */
        :root {
            --bg-color: #f8f9fa;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent-color: #0d6efd; 
            --border-color: #dee2e6;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* NAVIGATION */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: transparent;
            width: 100%;
        }

        .logo {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .logo-role {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-secondary);
            border-left: 2px solid var(--accent-color);
            padding-left: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-connect {
            text-decoration: none;
            border: 1px solid var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 2px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-connect:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        /* HERO SECTION */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 1; 
            padding: 0 5%;
        }

        .hero-content {
            flex: 1;
            max-width: 550px;
        }

        .tagline {
            font-family: var(--font-mono);
            color: var(--accent-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            font-weight: 600;
            letter-spacing: -1.5px;
        }

        p.desc {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        /* EXTERNAL GEAR ANIMATION */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }

        .gear-assembly {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotating-gear {
            width: 75%;
            height: 75%;
            transform-origin: center; /* Center is perfect for standard <img> tags */
            animation: spin 15s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Sensor UI Overlay Elements */
        .sensor-ui {
            position: absolute;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            pointer-events: none;
            background: var(--bg-color);
            padding: 2px 5px;
            z-index: 2; /* Ensures text stays above the gear */
        }

        .sensor-ui.omega { top: -10px; left: -20px; }
        .sensor-ui.torque { bottom: -10px; right: -20px; }
        
        .axis-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .axis-x, .axis-y {
            position: absolute;
            background-color: rgba(13, 110, 253, 0.2);
        }
        
        .axis-x { width: 120%; height: 1px; top: 50%; left: -10%; }
        .axis-y { width: 1px; height: 120%; left: 50%; top: -10%; } 

        /* FOOTER */
        footer {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .social-links a {
            color: var(--text-primary);
            font-size: 1.2rem;
            margin-right: 1rem;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: var(--accent-color);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 900px) {
            body { overflow: auto; }
            .hero {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding-top: 4rem;
                padding-bottom: 4rem;
            }
            .hero-content { margin-bottom: 4rem; }
            .hero-visual { justify-content: center; }
            .gear-assembly { transform: scale(0.8); }
            h1 { font-size: 3rem; }
            footer { flex-direction: column; gap: 1rem; text-align: center; }
            .social-links a { margin: 0 0.5rem; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo">
            Lorenzo De Sanctis 
            <span class="logo-role">Mechanical Engineer</span>
        </div>
        <a href="https://www.linkedin.com/in/lorenzo-desanctis-03/" target="_blank" class="btn-connect">Connect</a>
    </nav>

    <section id="home" class="hero">
        <div class="hero-content">
            <span class="tagline">Status: Prototyping...</span>
            <h1>Building<br>Things</h1>
            <p class="desc">
                The portfolio is currently under construction. Engineering new tools for humanity. Check back soon.
            </p>
        </div>

        <div class="hero-visual">
            <div class="gear-assembly">
                <div class="axis-lines">
                    <div class="axis-x"></div>
                    <div class="axis-y"></div>
                </div>
                <div class="sensor-ui omega">ω = 24 °/s</div>
                <div class="sensor-ui torque">τ = 45 N·m</div>

                <img src="gear.svg" alt="Mechanical Gear" class="rotating-gear">

            </div>
        </div>
    </section>

    <footer>
        <div class="social-links">
            <a href="https://scholar.google.com/citations?user=BS29bRMAAAAJ&hl=it" title="Google Scholar"><i class="fab fa-google-scholar"></i></a>
            <a href="https://github.com/LorenzoDeSanctis" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
        <p>Mechanical Engineering — &copy; 2026 Lorenzo De Sanctis.</p>
    </footer>

</body>
</html>
